name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"
    
    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Run tests
      run: pytest -v
    
    - name: Build complete
      run: echo "✅ Build successful!"
    
    - name: Test complete
      run: echo "✅ All tests passed!"
    
    - name: Deploy message
      run: echo "🚀 Ready to deploy to Render!"